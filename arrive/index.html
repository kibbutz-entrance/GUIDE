<script>
(()=>{'use strict';
const url='https://kibbutz-entrance.github.io/GUIDE/arrive/';
const video=document.getElementById('directions'),copy=document.getElementById('copy'),status=document.getElementById('status');
let timer;function notify(text){status.textContent=text;status.hidden=false;clearTimeout(timer);timer=setTimeout(()=>status.hidden=true,3200)}
video.addEventListener('error',()=>{document.getElementById('video-error').hidden=false});

})();
